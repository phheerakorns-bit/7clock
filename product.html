<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7CLOCK Collection | เลือกซื้อนาฬิกาพรีเมียม ดีไซน์เรียบหรู</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="nav-header">
      <a href="index.html" class="brand-logo">7CLOCK</a>
      <a href="index.html" class="btn btn-secondary">กลับหน้าแรก</a>
    </header>

    <h2 class="section-title tight">คอลเลกชันนาฬิกาทั้งหมด</h2>
    <p class="section-sub">เลือกนาฬิกาสไตล์ที่ใช่ เติมเต็มทุกลุคและทุกช่วงเวลาของคุณ</p>
    
    <div id="filter-bar">
      <button data-mood="all">ทั้งหมด</button>
      <button data-mood="classic">Classic (คลาสสิก)</button>
      <button data-mood="minimal">Minimal (มินิมอล)</button>
      <button data-mood="sport">Sport (สปอร์ต)</button>
      <button data-mood="luxury">Luxury (ลักชัวรี)</button>
    </div>

    <div id="product-list" class="product-grid"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
