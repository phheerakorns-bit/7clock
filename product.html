<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7clock Collection | เลือกซื้อนาฬิกาพรีเมียม ดีไซน์เรียบหรู</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="nav-header">
      <a href="index.html" class="brand-logo">7CLOCK</a>
      <a href="index.html" class="btn btn-secondary">กลับหน้าแรก</a>
    </header>

    <h2 style="text-align: center; margin-bottom: 0.5rem;">คอลเลกชันนาฬิกาทั้งหมด</h2>
    <p style="text-align: center; color: #666; margin-bottom: 1.5rem; font-size: 0.95rem;">เลือกนาฬิกาสไตล์ที่ใช่ เติมเต็มทุกลุคและทุกช่วงเวลาของคุณ</p>
    
    <div id="filter-bar">
      <button data-mood="all">ทั้งหมด</button>
      <button data-mood="seamless">Classic (คลาสสิก)</button>
      <button data-mood="cotton">Minimal (มินิมอล)</button>
      <button data-mood="sport">Sport (สปอร์ต)</button>
      <button data-mood="lounge">Luxury (ลักชัวรี)</button>
    </div>

    <div id="product-list" class="product-grid"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
